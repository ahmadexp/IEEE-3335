<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="720" viewBox="0 0 900 360">
  <style>
    .box { fill: #ffffff; stroke: #000000; stroke-width: 2; rx: 4; }
    .host { fill: #ffffff; stroke: #000000; stroke-width: 2; rx: 4; }
    .tc { fill: #ffffff; stroke: #000000; stroke-width: 2; rx: 4; }
    .text { font-family: sans-serif; font-size: 22px; font-weight: bold; fill: #000000; }
    .small { font-family: sans-serif; font-size: 18px; fill: #000000; }
    .label { font-family: sans-serif; font-size: 14px; font-weight: bold; fill: #000000; }
  </style>

  <rect x="30" y="80" width="170" height="170" fill="#000000"/>
  <rect x="32" y="82" width="166" height="166" fill="#ffffff"/>
  <text x="115" y="125" text-anchor="middle" class="text">Time Sources</text>
  <text x="115" y="155" text-anchor="middle" class="small">GNSS, PTP, PPS</text>
  <text x="115" y="178" text-anchor="middle" class="small">10 MHz, IRIG, NTP</text>

  <rect x="285" y="35" width="310" height="290" fill="#000000"/>
  <rect x="287" y="37" width="306" height="286" fill="#ffffff"/>
  <text x="440" y="70" text-anchor="middle" class="text">TimeCard</text>
  <rect x="315" y="92" width="250" height="54" fill="#000000"/>
  <rect x="317" y="94" width="246" height="50" fill="#ffffff"/>
  <text x="440" y="126" text-anchor="middle" class="small">Receive interfaces</text>
  <rect x="315" y="158" width="250" height="54" fill="#000000"/>
  <rect x="317" y="160" width="246" height="50" fill="#ffffff"/>
  <text x="440" y="192" text-anchor="middle" class="small">Unified timescale</text>
  <rect x="315" y="224" width="250" height="72" fill="#000000"/>
  <rect x="317" y="226" width="246" height="68" fill="#ffffff"/>
  <text x="440" y="253" text-anchor="middle" class="small">Providing interfaces</text>
  <text x="440" y="279" text-anchor="middle" class="small">Control interfaces</text>

  <rect x="690" y="80" width="180" height="170" fill="#000000"/>
  <rect x="692" y="82" width="176" height="166" fill="#ffffff"/>
  <text x="780" y="125" text-anchor="middle" class="text">Host System</text>
  <text x="780" y="155" text-anchor="middle" class="small">Processor, software</text>
  <text x="780" y="178" text-anchor="middle" class="small">Applications</text>

  <rect x="200" y="162" width="78" height="6" fill="#000000"/>
  <polygon points="285,165 273,158 273,172" fill="#000000"/>
  <rect x="595" y="142" width="88" height="6" fill="#000000"/>
  <polygon points="690,145 678,138 678,152" fill="#000000"/>
  <rect x="602" y="217" width="88" height="6" fill="#000000"/>
  <polygon points="595,220 607,213 607,227" fill="#000000"/>
  <text x="242" y="150" text-anchor="middle" class="label">references</text>
  <text x="642" y="130" text-anchor="middle" class="label">timing output</text>
  <text x="642" y="244" text-anchor="middle" class="label">control/status</text>
