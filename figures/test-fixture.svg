<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="720" viewBox="0 0 1000 360">
  <title>Representative TimeCard verification arrangement</title>
  <desc>An applied reference and host control connect to the TimeCard. A measurement instrument compares a declared TimeCard output with a separately identified measurement reference. Adapters depend on the implemented interfaces.</desc>
  <style>
    .box { fill: #ffffff; stroke: #000000; stroke-width: 2; }
    .title { font-family: sans-serif; font-size: 22px; font-weight: bold; fill: #000000; }
    .detail { font-family: sans-serif; font-size: 18px; fill: #000000; }
    .label { font-family: sans-serif; font-size: 17px; fill: #000000; }
    .path { fill: none; stroke: #000000; stroke-width: 3; }
  </style>
  <rect class="box" x="10" y="20" width="240" height="80"/>
  <text class="title" x="130" y="53" text-anchor="middle">Applied reference</text>
  <text class="detail" x="130" y="80" text-anchor="middle">declared source</text>
  <rect class="box" x="690" y="20" width="300" height="80"/>
  <text class="title" x="840" y="53" text-anchor="middle">Measurement reference</text>
  <text class="detail" x="840" y="80" text-anchor="middle">calibration and uncertainty</text>
  <rect class="box" x="330" y="190" width="260" height="100"/>
  <text class="title" x="460" y="230" text-anchor="middle">TimeCard under test</text>
  <text class="detail" x="460" y="261" text-anchor="middle">declared measurement point</text>
  <rect class="box" x="690" y="190" width="300" height="100"/>
  <text class="title" x="840" y="230" text-anchor="middle">Measurement instrument</text>
  <text class="detail" x="840" y="261" text-anchor="middle">applicable timing metrics</text>
  <rect class="box" x="10" y="210" width="240" height="80"/>
  <text class="title" x="130" y="243" text-anchor="middle">Host or controller</text>
  <text class="detail" x="130" y="270" text-anchor="middle">configuration and logs</text>
  <path class="path" d="M250 60 H285 V220 H320"/>
  <polygon points="330,220 318,213 318,227" fill="#000000"/>
  <text class="label" x="274" y="155" text-anchor="end">input</text>
  <path id="measurement-reference-path" class="path" d="M840 100 V180"/>
  <polygon points="840,190 833,178 847,178" fill="#000000"/>
  <text class="label" x="855" y="150">comparison</text>
  <path class="path" d="M590 240 H680"/>
  <polygon points="690,240 678,233 678,247" fill="#000000"/>
  <text class="label" x="640" y="223" text-anchor="middle">output</text>
  <path class="path" d="M250 250 H320"/>
  <polygon points="330,250 318,243 318,257" fill="#000000"/>
  <text class="label" x="290" y="278" text-anchor="middle">control</text>
  <text class="detail" x="500" y="329" text-anchor="middle">Signal, packet, or host-interface adapters depend on the implementation.</text>
  <text class="detail" x="500" y="352" text-anchor="middle">Identify shared references and correlated errors; no particular interface is mandatory here.</text>
</svg>
